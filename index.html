<style>

ul{margin:6px 0 0;padding-left:18px;max-height:260px;overflow:auto;font:12px/1.6 Consolas,monospace}ul li span{color:var(--mut)}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}header h1{margin:0}

  <div class="hdr"><button id="bHelp" data-i18n="manual"></button>

    <button class="pri" id="bPick" data-i18n="pick"></button>
    <input type="file" id="fallback" webkitdirectory class="hide">
    <span class="mut" id="rootName"></span>
  </div>
  <div class="row hide" id="alsRow" style="margin-top:10px"><select id="alsSel"></select><button id="bAnalyze" data-i18n="analyze"></button></div>

    <div class="row"><button class="pri" id="bCopy" data-i18n="copyBtn"></button>

    <div class="mut" id="pFile"></div><button class="danger" id="bCancel" data-i18n="cancel"></button></div>
  <div class="card hide" id="out"><h2 data-i18n="result"></h2><pre id="log"></pre><div class="wrap" id="outSum"></div>
    <div class="row" style="margin-top:12px"><button class="pri" id="bReset" data-i18n="reset"></button></div></div>
</div>

<script>
"use strict";
const B=(c,t)=>`<span class="btn ${c}">${t}</span>`;
const C={
de:{title:"Handbuch",by:"Entwickelt von Thorsten Banning",s:[
["intro","Überblick",`<p>Der <b>Ableton Set Cleaner</b> findet heraus, welche Dateien in einem Ableton-Projektordner von einem Live Set (<code>.als</code>) tatsächlich verwendet werden – und entfernt den Rest. So werden Projekte kleiner, übersichtlicher und leichter zu archivieren oder weiterzugeben.</p>
<ul><li>Läuft komplett lokal im Browser – es werden <b>keine Dateien hochgeladen</b>.</li><li>Unterstützt Live Sets von Live 9 bis Live 12.</li><li>Es wird <b>nie etwas gelöscht</b>: entweder entsteht eine bereinigte Kopie, oder ungenutzte Dateien werden in einen Quarantäne-Ordner verschoben.</li></ul>`],
["req","Voraussetzungen",`<table><tr><th>Browser</th><th>Analyse</th><th>Bereinigen</th></tr>
<tr><td>Chrome, Edge (Desktop)</td><td>✔</td><td>✔</td></tr><tr><td>Firefox, Safari</td><td>✔</td><td>– (nur Analyse)</td></tr></table>
<p>Zum Bereinigen wird die <i>File System Access API</i> benötigt, die nur Chromium-Browser bieten. Der Browser fragt beim Bereinigen nach Schreibzugriff – dieser muss erlaubt werden.</p>
<div class="tip">Ableton Live sollte das Set während der Bereinigung <b>nicht geöffnet</b> haben.</div>`],
["start","1. Projektordner wählen",`<ol><li>${B("pri","Projektordner wählen…")} klicken.</li><li>Den Ordner <b>„… Project“</b> auswählen, in dem die <code>.als</code>-Datei liegt (nicht einen Unterordner wie <code>Samples</code>).</li><li>Der Ordner wird eingelesen; die Anzahl der Dateien erscheint neben dem Button.</li></ol>
<p>Enthält der Ordner mehrere Sets, erscheint eine Auswahlliste. Sets im Ordner <code>Backup</code> werden ignoriert. Mit ${B("","Analysieren")} oder durch Wechsel in der Liste wird das gewählte Set neu analysiert.</p>`],
["analysis","2. Analyse lesen",`<h3>Kacheln</h3><table>
<tr><td><b>Projektordner</b></td><td>Größe vorher → nachher und die erwartete Ersparnis.</td></tr>
<tr><td><b>Im Projekt verwendet</b></td><td>Dateien im Projektordner, die das Set referenziert.</td></tr>
<tr><td><b>Ungenutzt</b></td><td>Dateien, die das Set nicht benötigt – Kandidaten zum Entfernen.</td></tr>
<tr><td><b>Extern verwendet</b></td><td>Referenzen auf Dateien außerhalb des Projektordners (z.B. Library). Der Browser kann sie nicht prüfen.</td></tr>
<tr><td><b>Fehlend</b></td><td>Referenzierte Dateien, die nicht gefunden wurden. Sollte <span style="color:var(--acc2)">0</span> sein.</td></tr></table>
<h3>Dateitypen-Tabelle</h3><p>Zeigt je Dateiendung Anzahl und Größe vorher/nachher (Prognose). Der graue Balken steht für „vorher“, der grüne für „nachher“.</p>
<h3>Details</h3><p>Aufklappbare Listen aller verwendeten, ungenutzten, externen und fehlenden Dateien mit Größe – ideal zum Gegenprüfen vor dem Bereinigen.</p>`],
["clean","3. Bereinigen",`<h3>${B("pri","Bereinigtes neues Projekt erstellen…")} <span class="mut">(empfohlen)</span></h3>
<ol><li>Namen für das neue Set eintragen (Vorschlag: <code>&lt;Set&gt; clean</code>).</li><li>Button klicken und einen Zielordner <b>außerhalb</b> des Projekts wählen.</li><li>Dort entsteht <code>&lt;Name&gt; Project</code> mit allen benötigten Dateien, dem Ordner <code>Ableton Project Info</code> und dem neuen Set. Alle Pfade im Set werden projekt-relativ gesetzt.</li></ol>
<p>Das Original bleibt <b>unverändert</b>. Jede Datei wird nach dem Kopieren auf korrekte Größe geprüft.</p>
<h3>${B("danger","Im Ordner aufräumen (Quarantäne)…")}</h3>
<ol><li>Button klicken und einen Ordner <b>außerhalb</b> des Projekts wählen (z.B. den übergeordneten Ordner).</li><li>Nach Bestätigung werden alle ungenutzten Dateien nach <code>&lt;Projekt&gt; _unused_JJJJMMTT-hhmmss</code> verschoben – mit gleicher Ordnerstruktur.</li><li>Leer gewordene Ordner im Projekt werden entfernt, danach wird neu analysiert.</li></ol>
<div class="tip">Wenn alles funktioniert, kann der Quarantäne-Ordner später von Hand gelöscht werden. Bis dahin lässt sich alles zurückkopieren.</div>`],
["progress","Fortschritt & Abbrechen",`<p>Während des Vorgangs zeigt die Fortschrittsanzeige Prozent, aktuelle Datei, Datenmenge, Geschwindigkeit und Restzeit. Mit ${B("danger","Abbrechen")} wird nach dem aktuellen Block gestoppt:</p>
<ul><li><b>Neues Projekt:</b> der unvollständige Zielordner kann gelöscht werden, das Original ist unverändert.</li><li><b>Aufräumen:</b> bereits verschobene Dateien liegen im Quarantäne-Ordner – nichts geht verloren.</li></ul>
<p>Das Ergebnis-Feld fasst den Vorgang zusammen. ${B("pri","Neuen Vorgang starten")} setzt die Oberfläche zurück.</p>`],
["notes","Was wird erkannt?",`<ul><li>Alle <code>FileRef</code>-Einträge des Sets: Samples, Clips, Presets, Max-Devices, Plug-in-Presets usw.</li>
<li>Zugehörige Analysedateien (<code>.asd</code>) werden automatisch mitgenommen.</li>
<li>Referenzen auf ganze Ordner (z.B. Max for Live) übernehmen den kompletten Ordnerinhalt.</li>
<li>Absolute Pfade werden auf den Projektordner abgebildet, auch wenn das Projekt verschoben wurde.</li>
<li><code>Ableton Project Info</code> bleibt immer erhalten.</li></ul>
<div class="warn">Andere Sets im selben Projekt werden <b>nicht</b> berücksichtigt. Dateien, die nur ein anderes Set nutzt, gelten als ungenutzt. Im Zweifel die Variante „Neues Projekt“ verwenden.</div>`],
["faq","FAQ / Fehlerbehebung",`<details><summary>„Keine .als-Datei gefunden“</summary><p>Es wurde ein Unterordner gewählt. Bitte den eigentlichen Projektordner wählen.</p></details>
<details><summary>„Live Set konnte nicht gelesen werden“</summary><p>Die Datei ist beschädigt oder kein gültiges Live Set. In Ableton öffnen und erneut speichern.</p></details>
<details><summary>Fehlende Dateien werden angezeigt</summary><p>Diese fehlten bereits vorher. In Live über <i>Datei → Verwalten → Fehlende Dateien suchen</i> reparieren, dann neu analysieren.</p></details>
<details><summary>Externe Dateien sollen ins Projekt</summary><p>In Live <i>Datei → Verwalten → Sammeln und speichern</i> ausführen, danach bereinigen.</p></details>
<details><summary>Buttons zum Bereinigen sind deaktiviert</summary><p>Der Browser unterstützt keinen Schreibzugriff. Chrome oder Edge verwenden.</p></details>
<details><summary>„Zielordner darf nicht im Projektordner liegen“</summary><p>Ziel- bzw. Quarantäne-Ordner muss außerhalb des Projekts liegen, z.B. eine Ebene höher.</p></details>`]]},
en:{title:"Manual",by:"Developed by Thorsten Banning",s:[
["intro","Overview",`<p><b>Ableton Set Cleaner</b> works out which files in an Ableton project folder are actually used by a Live Set (<code>.als</code>) – and removes the rest. Projects become smaller, tidier and easier to archive or share.</p>
<ul><li>Runs entirely locally in the browser – <b>no files are uploaded</b>.</li><li>Supports Live Sets from Live 9 to Live 12.</li><li><b>Nothing is ever deleted</b>: either a clean copy is created, or unused files are moved to a quarantine folder.</li></ul>`],
["req","Requirements",`<table><tr><th>Browser</th><th>Analysis</th><th>Clean up</th></tr>
<tr><td>Chrome, Edge (desktop)</td><td>✔</td><td>✔</td></tr><tr><td>Firefox, Safari</td><td>✔</td><td>– (analysis only)</td></tr></table>
<p>Cleaning requires the <i>File System Access API</i>, available only in Chromium browsers. The browser asks for write access when cleaning – please allow it.</p>
<div class="tip">Ableton Live should <b>not have the set open</b> while cleaning.</div>`],
["start","1. Choose project folder",`<ol><li>Click ${B("pri","Choose project folder…")}.</li><li>Select the <b>“… Project”</b> folder containing the <code>.als</code> file (not a subfolder like <code>Samples</code>).</li><li>The folder is read; the file count appears next to the button.</li></ol>
<p>If the folder contains several sets, a dropdown appears. Sets in the <code>Backup</code> folder are ignored. ${B("","Analyze")} or changing the selection re-analyzes the chosen set.</p>`],
["analysis","2. Reading the analysis",`<h3>Tiles</h3><table>
<tr><td><b>Project folder</b></td><td>Size before → after and the expected savings.</td></tr>
<tr><td><b>Used in project</b></td><td>Files inside the project folder referenced by the set.</td></tr>
<tr><td><b>Unused</b></td><td>Files the set does not need – candidates for removal.</td></tr>
<tr><td><b>Used externally</b></td><td>References to files outside the project folder (e.g. Library). The browser cannot verify them.</td></tr>
<tr><td><b>Missing</b></td><td>Referenced files that could not be found. Should be <span style="color:var(--acc2)">0</span>.</td></tr></table>
<h3>File type table</h3><p>Shows count and size per file extension before/after (forecast). Grey bar = before, green bar = after.</p>
<h3>Details</h3><p>Expandable lists of all used, unused, external and missing files with sizes – ideal for double-checking before cleaning.</p>`],
["clean","3. Clean up",`<h3>${B("pri","Create clean new project…")} <span class="mut">(recommended)</span></h3>
<ol><li>Enter a name for the new set (default: <code>&lt;Set&gt; clean</code>).</li><li>Click the button and choose a target folder <b>outside</b> the project.</li><li>A <code>&lt;Name&gt; Project</code> is created there with all required files, the <code>Ableton Project Info</code> folder and the new set. All paths in the set are made project-relative.</li></ol>
<p>The original stays <b>unchanged</b>. Every file is size-checked after copying.</p>
<h3>${B("danger","Clean up in place (quarantine)…")}</h3>
<ol><li>Click the button and choose a folder <b>outside</b> the project (e.g. the parent folder).</li><li>After confirming, all unused files are moved to <code>&lt;Project&gt; _unused_YYYYMMDD-hhmmss</code> – keeping the folder structure.</li><li>Folders left empty are removed, then the project is re-analyzed.</li></ol>
<div class="tip">Once everything works, you can delete the quarantine folder manually. Until then everything can be copied back.</div>`],
["progress","Progress & cancel",`<p>The progress bar shows percentage, current file, data volume, speed and remaining time. ${B("danger","Cancel")} stops after the current block:</p>
<ul><li><b>New project:</b> the incomplete target folder can be deleted; the original is unchanged.</li><li><b>Clean up:</b> files already moved are in the quarantine folder – nothing is lost.</li></ul>
<p>The result box summarizes the run. ${B("pri","Start new run")} resets the interface.</p>`],
["notes","What is detected?",`<ul><li>All <code>FileRef</code> entries of the set: samples, clips, presets, Max devices, plug-in presets etc.</li>
<li>Matching analysis files (<code>.asd</code>) are kept automatically.</li>
<li>References to whole folders (e.g. Max for Live) keep the entire folder content.</li>
<li>Absolute paths are mapped onto the project folder, even if the project was moved.</li>
<li><code>Ableton Project Info</code> is always kept.</li></ul>
<div class="warn">Other sets in the same project are <b>not</b> considered. Files used only by another set count as unused. When in doubt, use “New project”.</div>`],
["faq","FAQ / Troubleshooting",`<details><summary>“No .als file found”</summary><p>A subfolder was selected. Please choose the actual project folder.</p></details>
<details><summary>“Could not read the Live Set”</summary><p>The file is damaged or not a valid Live Set. Open it in Ableton and save it again.</p></details>
<details><summary>Missing files are shown</summary><p>They were already missing. Fix via <i>File → Manage Files → Locate missing files</i> in Live, then re-analyze.</p></details>
<details><summary>External files should go into the project</summary><p>Run <i>File → Collect All and Save</i> in Live, then clean up.</p></details>
<details><summary>Cleanup buttons are disabled</summary><p>The browser has no write access support. Use Chrome or Edge.</p></details>
<details><summary>“Target folder must not be inside the project folder”</summary><p>The target/quarantine folder must be outside the project, e.g. one level up.</p></details>`]]}
};
const q=new URLSearchParams(location.search);
let lang=q.get("lang");
if(!C[lang]){try{lang=localStorage.getItem("als-lang")}catch(e){}if(!C[lang])lang=(navigator.language||"").toLowerCase().startsWith("de")?"de":"en"}

// files: key(lower rel) -> {rel,size,handle?,file?,dir?(parent handle)}; dirs: key -> {rel,handle?}

async function scanHandle(root){
  const files=new Map(),dirs=new Map();let n=0;
  async function walk(dh,prefix){
    for await(const [name,h] of dh.entries()){
      const rel=prefix?prefix+"/"+name:name;
      if(h.kind==="directory"){dirs.set(rel.toLowerCase(),{rel,handle:h,parent:dh});await walk(h,rel)}
      else{const f=await h.getFile();files.set(rel.toLowerCase(),{rel,size:f.size,handle:h,dir:dh});if(++n%200===0)status(tx("reading",n))}
    }}
  await walk(root,"");return {files,dirs};
}
function scanFileList(list){
  const files=new Map(),dirs=new Map();
  for(const f of list){const parts=f.webkitRelativePath.split("/").slice(1),rel=parts.join("/");
    files.set(rel.toLowerCase(),{rel,size:f.size,file:f});
    for(let i=1;i<parts.length;i++){const d=parts.slice(0,i).join("/");dirs.set(d.toLowerCase(),{rel:d})}}
  return {files,dirs};
}
async function load(scan,rootName,root){

  await analyze();
}

/* ---------------------------------------------------------------- ALS parsing */
async function gunzip(buf){
  const u=new Uint8Array(buf);
  if(u[0]!==0x1f||u[1]!==0x8b)return buf;
  return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
}
async function gzip(text){return new Response(new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"))).blob()}
const kid=(el,tag)=>{for(const c of el.children)if(c.tagName===tag)return c;return null};
const val=(el,tag)=>{const c=kid(el,tag);return c?c.getAttribute("Value"):null};

function relativeOf(fr){
  const rp=kid(fr,"RelativePath");if(!rp)return null;
  if(rp.hasAttribute("Value"))return rp.getAttribute("Value")||null;          // Live 11/12
  const dirs=[...rp.children].filter(c=>c.tagName==="RelativePathElement").map(e=>e.getAttribute("Dir")||"..");
  const name=val(fr,"Name");return name?[...dirs,name].join("/"):null;         // Live 9/10
}
function absoluteOf(fr){
  const p=val(fr,"Path");if(p)return p;                                       // Live 11/12
  const name=val(fr,"Name"),data=kid(fr,"Data");
  if(data&&data.textContent.trim()){                                          // Live 9/10 Windows: UTF-16 hex
    try{const hex=data.textContent.replace(/\s+/g,""),b=new Uint8Array(hex.length/2);
      for(let i=0;i<b.length;i++)b[i]=parseInt(hex.substr(i*2,2),16);
      const s=new TextDecoder("utf-16le").decode(b).replace(/\0+$/,"");
      if(s&&(s.includes(":")||s.startsWith("\\")||s.startsWith("/")))return s}catch(e){}
  }
  const sh=kid(fr,"SearchHint"),hint=sh&&kid(sh,"PathHint");
  if(hint&&name){const d=[...hint.children].filter(c=>c.tagName==="RelativePathElement").map(e=>e.getAttribute("Dir")||"");
    if(d.length)return(/^[A-Za-z]:$/.test(d[0])?d[0]+"\\":"/"+d[0]+"/")+[...d.slice(1),name].join("\\")}
  return null;
}
function normJoin(base,rel){
  const st=[];for(const p of[...(base?base.split("/"):[]),...rel.split(/[\\/]/)]){
    if(p===""||p===".")continue;if(p===".."){if(!st.length)return null;st.pop()}else st.push(p)}
  return st.join("/");
}
const exists=k=>S.files.has(k)||S.dirs.has(k);

function resolveRef(fr,alsDir){
  const rel=relativeOf(fr),ab=absoluteOf(fr),c=[];
  if(rel){c.push(normJoin("",rel),normJoin(alsDir,rel))}
  if(ab){const parts=ab.split(/[\\/]/),rn=S.rootName.toLowerCase();       // absoluten Pfad auf Projektordner abbilden
    for(let i=parts.length-2;i>=0;i--)if(parts[i].toLowerCase()===rn){c.push(parts.slice(i+1).join("/"));break}}
  for(const r of c)if(r!==null&&r!==""&&exists(r.toLowerCase()))return{kind:"inside",key:r.toLowerCase()};
  if(ab&&!c.slice(rel?2:0).length)return{kind:"external",key:"abs:"+ab.toLowerCase(),path:ab};
  const first=c.find(r=>r);if(first)return{kind:"missing",key:"rel:"+first.toLowerCase(),path:first};
  return ab?{kind:"missing",key:"abs:"+ab.toLowerCase(),path:ab}:null;
}

async function analyze(){
  err();busy(true);status(tx("analyzing"));
  try{
    const alsRel=$("#alsSel").value,alsE=S.files.get(alsRel.toLowerCase());
    const text=new TextDecoder().decode(await gunzip(await (await fileOf(alsE)).arrayBuffer()));
    const xml=new DOMParser().parseFromString(text,"application/xml");
    if(xml.querySelector("parsererror"))throw new Error(tx("xmlErr"));
    const alsDir=dirOf(alsRel),refs=[],uniq=new Map();
    for(const fr of xml.getElementsByTagName("FileRef")){const r=resolveRef(fr,alsDir);if(!r)continue;refs.push({el:fr,...r});if(!uniq.has(r.key))uniq.set(r.key,r)}
    const U=[...uniq.values()];
    const inside=U.filter(r=>r.kind==="inside").map(r=>r.key).sort();
    const external=U.filter(r=>r.kind==="external").map(r=>r.path).sort();
    const missing=U.filter(r=>r.kind==="missing").map(r=>r.path).sort();
    const needed=new Set([alsRel.toLowerCase()]);
    for(const k of inside){
      if(S.dirs.has(k)){for(const f of S.files.keys())if(f.startsWith(k+"/"))needed.add(f)}
      else{needed.add(k);needed.add(k+".asd")}
    }
    const unused=[...S.files.keys()].filter(k=>!needed.has(k)&&!k.startsWith(PROJECT_INFO+"/")).sort();
    const sizeOfKey=k=>S.files.has(k)?S.files.get(k).size:[...S.files.entries()].filter(([f])=>f.startsWith(k+"/")).reduce((s,[,e])=>s+e.size,0);
    const before=[...S.files.values()].map(e=>[e.rel,e.size]),un=new Set(unused);
    S.A={alsRel,xml,refs,inside,external,missing,needed,unused,sizeOfKey,
      summary:summaryData(before,[...S.files.entries()].filter(([k])=>!un.has(k)).map(([,e])=>[e.rel,e.size]))};
    render(S.A,sizeOfKey);
    if(!$("#name").value||$("#name").dataset.for!==alsRel){$("#name").value=baseOf(alsRel).replace(/\.als$/i,"")+tx("cleanSuffix");$("#name").dataset.for=alsRel}
    status("");
  }catch(e){err(e);status("")}finally{busy(false)}
}

/* ---------------------------------------------------------------- Summary */
function summaryData(before,after){
  const st=l=>{const m=new Map();for(const[r,s]of l){const e=ext(r),[c,b]=m.get(e)||[0,0];m.set(e,[c+1,b+s])}return m};
  const b=st(before),a=st(after),keys=[...new Set([...b.keys(),...a.keys()])];
  const g=(m,k)=>m.get(k)||[0,0];
  const rows=keys.map(k=>({ext:k,count_before:g(b,k)[0],size_before:g(b,k)[1],count_after:g(a,k)[0],size_after:g(a,k)[1]}))
    .sort((x,y)=>Math.max(y.size_before,y.size_after)-Math.max(x.size_before,x.size_after));
  const total={};for(const f of["count_before","size_before","count_after","size_after"])total[f]=rows.reduce((s,r)=>s+r[f],0);
  return{rows,total};
}
function sumTable(s){
  const t=s.total,max=Math.max(1,...s.rows.map(r=>Math.max(r.size_before,r.size_after))),w=v=>(v/max*100).toFixed(1)+"%";
  const row=(r,cls)=>`<tr class="${cls||""}"><td>${esc(r.ext||tx("noext"))}</td><td class="n">${r.count_before}</td><td class="n">${human(r.size_before)}</td><td class="n">${r.count_after}</td><td class="n">${human(r.size_after)}</td>`+
    (cls?"<td></td>":`<td class="bar"><span class="b" style="width:${w(r.size_before)}"></span><span class="b a" style="width:${w(r.size_after)}"></span></td>`)+"</tr>";
  const d=t.size_before-t.size_after,p=t.size_before?(d/t.size_before*100).toFixed(1):"0.0";
  return `<p style="margin:0 0 8px"><b>${tx("folderSize")}: ${human(t.size_before)} → ${human(t.size_after)}</b> <span class="mut">· ${tx("savings")} ${human(Math.max(d,0))} (${p} %)</span>
    <span class="legend"><i style="background:var(--bar)"></i>${tx("before")}<i style="background:var(--acc2)"></i>${tx("after")}</span></p>
    <table><thead><tr><th>${tx("thType")}</th><th class="n">${tx("thCntB")}</th><th class="n">${tx("thSizeB")}</th><th class="n">${tx("thCntA")}</th><th class="n">${tx("thSizeA")}</th><th></th></tr></thead>
    <tbody>${s.rows.map(r=>row(r)).join("")}${row(Object.assign({ext:tx("total")},t),"tot")}</tbody></table>`;
}
function list(title,items,fmt){return items.length?`<details><summary>${title} (${items.length})</summary><ul>${items.map(i=>"<li>"+fmt(i)+"</li>").join("")}</ul></details>`:""}
function render(A,sizeOfKey){
  const t=A.summary.total,dd=t.size_before-t.size_after,sum=ks=>ks.reduce((s,k)=>s+sizeOfKey(k),0);
  $("#tiles").innerHTML=`
    <div class="tile big"><span class="mut">${tx("projFolder")}</span><b>${human(t.size_before)} → <span class="ok">${human(t.size_after)}</span></b><span class="mut">${tx("savings")} ${human(dd)} (${t.size_before?(dd/t.size_before*100).toFixed(1):0} %)</span></div>
    <div class="tile"><span class="mut">${tx("usedIn")}</span><b>${A.inside.length}</b><span class="mut">${human(sum(A.inside))}</span></div>
    <div class="tile"><span class="mut">${tx("unused")}</span><b>${A.unused.length}</b><span class="mut">${human(sum(A.unused))}</span></div>
    <div class="tile"><span class="mut">${tx("external")}</span><b>${A.external.length}</b><span class="mut">${tx("notCheckable")}</span></div>
    <div class="tile"><span class="mut">${tx("missing")}</span><b class="${A.missing.length?"bad":"ok"}">${A.missing.length}</b><span class="mut">${A.refs.length} FileRefs</span></div>`;
  $("#sum").innerHTML=sumTable(A.summary);
  const f=k=>esc(S.files.get(k)?.rel||S.dirs.get(k)?.rel||k)+" <span>"+human(sizeOfKey(k))+"</span>";
  $("#lists").innerHTML=`<p class="mut" style="margin:0 0 6px">${esc(S.rootName)} / ${esc(A.alsRel)}</p>`+
    list(tx("usedIn"),A.inside,f)+list(tx("unusedIn"),A.unused,f)+
    list(tx("external"),A.external,esc)+list(tx("missing"),A.missing,esc);
  $("#bInplace").disabled=!A.unused.length;
  $("#res").classList.remove("hide");
}

/* ---------------------------------------------------------------- Actions */
async function ensureRW(h){if(h.requestPermission&&await h.requestPermission({mode:"readwrite"})!=="granted")throw new Error(tx("noWrite"))}
async function mkdirs(base,rel){let d=base;for(const p of rel.split("/").filter(Boolean))d=await d.getDirectoryHandle(p,{create:true});return d}
/* Fortschritt: Bytes-genau, Dateien 0-97 %, danach Set/Aufräumen */
class Cancelled extends Error{constructor(){super(tx("cancelled"));this.name="Cancelled"}}
const P={
  begin(){Object.assign(this,{on:true,cancel:false,phaseName:tx("prepare"),pct:0,done:0,total:0,fd:0,ft:0,cur:"",t0:performance.now(),last:0});
    $("#out").classList.add("hide");$("#bCancel").disabled=false;$("#pFill").style.width="0";
    $("#prog").classList.remove("hide");$("#prog").scrollIntoView({behavior:"smooth",block:"center"});this.draw(true)},
  start(phase,total,files){Object.assign(this,{phaseName:phase,total,ft:files,done:0,fd:0,t0:performance.now()});this.draw(true)},
  check(){if(this.cancel)throw new Cancelled()},
  add(n){this.check();this.done+=n;if(this.total)this.pct=Math.max(this.pct,97*this.done/this.total);this.draw()},
  file(rel){this.check();this.cur=rel;this.draw(true)},
  fileDone(){this.fd++;if(!this.total)this.pct=Math.max(this.pct,97*this.fd/Math.max(this.ft,1));this.draw()},
  phase(name,pct){this.phaseName=name;this.cur="";this.pct=Math.max(this.pct,pct);this.draw(true)},
  end(label){this.on=false;$("#pPhase").textContent=label;$("#bCancel").disabled=true},
  draw(force){const now=performance.now();if(!force&&now-this.last<100)return;this.last=now;
    $("#pPhase").textContent=this.phaseName+(this.pct<100?"…":"");$("#pFill").style.width=this.pct.toFixed(1)+"%";$("#pPct").textContent=Math.floor(this.pct)+" %";
    const sec=(now-this.t0)/1000,info=[];
    if(this.ft)info.push(tx("fileOf",Math.min(this.fd+1,this.ft),this.ft));
    if(this.total){info.push(tx("of",human(this.done),human(this.total)));
      const rate=this.done/Math.max(sec,.001);if(sec>1&&rate>0&&this.done<this.total)info.push(tx("remaining",human(rate),fmtT((this.total-this.done)/rate)))}
    $("#pInfo").textContent=info.join(" · ");$("#pFile").textContent=this.cur}
};
const fmtT=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
window.addEventListener("beforeunload",e=>{if(P.on){e.preventDefault();e.returnValue=""}});
$("#bCancel").onclick=()=>{P.cancel=true;$("#bCancel").disabled=true;$("#pPhase").textContent=tx("cancelling")};

/* Datei blockweise kopieren (Fortschritt pro Block) und Größe prüfen */
async function copyFile(src,dir,name){
  const fh=await dir.getFileHandle(name,{create:true}),w=await fh.createWritable(),rd=src.stream().getReader();
  try{for(;;){const{done,value}=await rd.read();if(done)break;P.check();await w.write(value);P.add(value.byteLength)}await w.close()}
  catch(e){try{await w.abort()}catch(x){}try{await dir.removeEntry(name)}catch(x){}throw e}
  if((await fh.getFile()).size!==src.size)throw new Error(tx("sizeMismatch",name));
}
async function writeFile(dir,name,data){const fh=await dir.getFileHandle(name,{create:true}),w=await fh.createWritable();await w.write(data);await w.close()}
async function isInside(outer,inner){return outer.resolve?(await outer.resolve(inner))!==null:false}
const ts=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`};
function showResult(log,summary){lastOutSum=summary||null;$("#log").textContent=log;$("#outSum").innerHTML=summary?sumTable(summary):"";$("#out").classList.remove("hide");$("#out").scrollIntoView({behavior:"smooth"})}

async function cleanCopy(){
  const A=S.A,name=($("#name").value.trim()||baseOf(A.alsRel).replace(/\.als$/i,"")).replace(/[\\/:*?"<>|]/g,"_");
  let target;try{target=await showDirectoryPicker({id:"als-target",mode:"readwrite"})}catch(e){return}
  err();busy(true);P.begin();let outName="",copied=0;
  try{
    await ensureRW(target);
    if(await isInside(S.root,target))throw new Error(tx("targetInside"));
    outName=`${name} Project`;
    try{const ex=await target.getDirectoryHandle(outName);for await(const _ of ex.keys())throw new Error(tx("targetExists",outName))}catch(e){if(e.name!=="NotFoundError"&&e.name!=="TypeMismatchError")throw e}
    const out=await target.getDirectoryHandle(outName,{create:true});
    const keys=[...S.files.keys()].filter(k=>k!==A.alsRel.toLowerCase()&&(A.needed.has(k)||k.startsWith(PROJECT_INFO+"/")));
    const written=[];
    P.start(tx("copying"),keys.reduce((s,k)=>s+S.files.get(k).size,0),keys.length);
    for(const k of keys){const e=S.files.get(k);P.file(e.rel);
      await copyFile(await fileOf(e),await mkdirs(out,dirOf(e.rel)),baseOf(e.rel));written.push([e.rel,e.size]);copied++;P.fileDone()}
    P.phase(tx("saveSet"),97);
    // Referenzen auf Projekt-relativ setzen
    for(const r of A.refs){if(r.kind!=="inside")continue;const fr=r.el,rp=kid(fr,"RelativePath"),rel=S.files.get(r.key)?.rel||S.dirs.get(r.key)?.rel;
      if(!rp||!rel)continue;
      for(const[t,v]of[["RelativePathType","3"],["HasRelativePath","true"]]){const c=kid(fr,t);if(c)c.setAttribute("Value",v)}
      if(rp.hasAttribute("Value"))rp.setAttribute("Value",rel);
      else{while(rp.firstChild)rp.removeChild(rp.firstChild);
        for(const d of rel.split("/").slice(0,-1)){const el=A.xml.createElement("RelativePathElement");el.setAttribute("Dir",d);rp.appendChild(el)}}
    }
    const xmlText='<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(A.xml.documentElement);
    const blob=await gzip(xmlText),alsName=`${name}.als`,alsDirRel=dirOf(A.alsRel);
    await writeFile(await mkdirs(out,alsDirRel),alsName,blob);written.push([(alsDirRel?alsDirRel+"/":"")+alsName,blob.size]);
    P.phase(tx("done"),100);P.end(tx("done"));$("#prog").classList.add("hide");
    const secs=(performance.now()-P.t0)/1000;
    const log=[tx("newProj")+`${target.name} / ${outName}`,tx("newSet")+((alsDirRel?alsDirRel+"/":"")+alsName),
      tx("copySum",A.inside.length,A.unused.length)];
    if(A.missing.length)log.push(tx("warnMissing",A.missing.length));
    if(A.external.length)log.push(tx("noteExt",A.external.length));
    log.push("",tx("duration")+fmtT(secs));
    showResult(log.join("\n"),summaryData([...S.files.values()].map(e=>[e.rel,e.size]),written));
  }catch(e){
    if(e.name==="Cancelled"){P.end(tx("cancelled"));showResult(tx("copyCancelled",copied,P.ft,`${target.name} / ${outName}`))}
    else{P.end(tx("errLabel"));err(e)}
  }finally{P.on=false;status("");busy(false)}
  await analyze();                         // XML im Speicher wurde ggf. verändert -> neu einlesen
}

async function cleanInPlace(){
  const A=S.A,n=A.unused.length,size=human(A.unused.reduce((s,k)=>s+S.files.get(k).size,0));
  if(!n)return;
  let target;try{target=await showDirectoryPicker({id:"als-quarantine",mode:"readwrite"})}catch(e){return}
  if(!confirm(tx("confirmMove",n,size,S.rootName,`${target.name} / ${S.rootName}`)))return;
  err();busy(true);P.begin();let moved=0,total=0,qName="";const sel=A.alsRel;
  try{
    await ensureRW(S.root);await ensureRW(target);
    if(await isInside(S.root,target))throw new Error(tx("quarInside"));
    const before=[...S.files.values()].map(e=>[e.rel,e.size]);
    qName=`${S.rootName} _unused_${ts()}`;const q=await target.getDirectoryHandle(qName,{create:true});
    P.start(tx("moving"),A.unused.reduce((s,k)=>s+S.files.get(k).size,0),n);
    for(const k of A.unused){const e=S.files.get(k);P.file(e.rel);
      const dst=await mkdirs(q,dirOf(e.rel));let ok=false;
      if(e.handle.move){try{await e.handle.move(dst);ok=true;P.add(e.size)}catch(x){if(x.name==="Cancelled")throw x}}   // gleiches Laufwerk: sofort
      if(!ok){await copyFile(await e.handle.getFile(),dst,baseOf(e.rel));await e.dir.removeEntry(baseOf(e.rel))}
      total+=e.size;moved++;P.fileDone()}
    P.phase(tx("tidy"),97);
    // leere Ordner entfernen (tiefste zuerst)
    for(const d of[...S.dirs.values()].sort((a,b)=>b.rel.split("/").length-a.rel.split("/").length)){
      let empty=true;for await(const _ of d.handle.keys()){empty=false;break}
      if(empty)try{await d.parent.removeEntry(baseOf(d.rel))}catch(x){}
    }
    P.phase(tx("rescan"),99);
    const scan=await scanHandle(S.root),secs=(performance.now()-P.t0)/1000;
    P.phase(tx("done"),100);P.end(tx("done"));$("#prog").classList.add("hide");
    showResult(tx("movedTo",n,human(total),`${target.name} / ${qName}`)+"\n\n"+tx("duration")+fmtT(secs),
      summaryData(before,[...scan.files.values()].map(e=>[e.rel,e.size])));
    await load(scan,S.rootName,S.root);$("#alsSel").value=sel;return;
  }catch(e){
    if(e.name==="Cancelled"){P.end(tx("cancelled"));showResult(tx("moveCancelled",moved,n,human(total),`${target.name} / ${qName}`))}
    else{P.end(tx("errLabel"));err(e)}
  }finally{P.on=false;status("");busy(false)}
  try{await load(await scanHandle(S.root),S.rootName,S.root);$("#alsSel").value=sel}catch(e){err(e)}
}

  await load(scanFileList(l),l[0].webkitRelativePath.split("/")[0],null)};
$("#bAnalyze").onclick=analyze;$("#alsSel").onchange=analyze;
function reset(){
  S={root:null,rootName:"",files:new Map(),dirs:new Map(),A:null};
  ["#res","#out","#alsRow","#prog"].forEach(s=>$(s).classList.add("hide"));
  $("#alsSel").innerHTML="";lastOutSum=null;$("#name").value="";delete $("#name").dataset.for;$("#fallback").value="";

$("#bReset").onclick=reset;
$("#bCopy").onclick=cleanCopy;$("#bInplace").onclick=cleanInPlace;
$("#bCopy").dataset.fs=$("#bInplace").dataset.fs="1";
applyLang();
busy(false);
